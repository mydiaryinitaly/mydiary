function pageHome(){return `<section class="hero"><h1>Find Your Study Program in Italy</h1><p>Explore Italian universities, discover degree programs, and find admission information — all in one place, completely free.</p>

function goSearch(){F.q=$("#hq").value;location.hash="#explore"}

function filtered(){const g=k=>r=>String(r[k]||"").toLowerCase();let q=F.q.toLowerCase();
 let L=ROWS.filter(r=>{const s=status(r);
  if(q&&!(g("university")(r)+" "+g("program")(r)).includes(q))return false;
  if(F.field&&r.field!==F.field)return false;if(F.level&&r.level!==F.level)return false;
  if(F.uni.length&&!F.uni.includes(r.university))return false;if(F.lang&&r.language!==F.lang)return false;
  if(F.status&&s!==F.status)return false;
  if(F.city&&!(g("city")(r)+" "+g("region")(r)).includes(F.city.toLowerCase()))return false;
  if(F.ielts&&!g("ielts")(r).includes(F.ielts.toLowerCase())&&!g("english_req")(r).includes(F.ielts.toLowerCase()))return false;
  if(F.test&&!g("entrance_test")(r).startsWith(F.test))return false;
  if(F.sch&&!g("scholarship")(r).startsWith(F.sch))return false;return true});
 const c={deadline:(a,b)=>(dt(a.deadline)||9e15)-(dt(b.deadline)||9e15),uni:(a,b)=>String(a.university).localeCompare(b.university),prog:(a,b)=>String(a.program).localeCompare(b.program)}[F.sort];
 return L.sort(c)}
function opts(arr,sel){return `<option value="">All</option>`+arr.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("")}
function pageExplore(){const unis=[...new Set(ROWS.map(r=>r.university).filter(Boolean))].sort();
 return `<h1>Explore Programs</h1><button id="ftoggle" class="btn alt" style="margin-bottom:12px">Show / hide filters</button><div class="layout"><aside id="filters" class="card" style="align-self:start">

function bindExplore(){const map={fq:["q"],ff:["field"],fl:["level"],fg:["lang"],fs:["status"],fc:["city"],fi:["ielts"],ft:["test"],fh:["sch"],fsort:["sort"]};
 for(const id in map)$("#"+id).addEventListener("input",e=>{F[map[id][0]]=e.target.value;shown=12;list()});

 $("#fclear").onclick=()=>{F={q:"",field:"",level:"",uni:[],lang:"",status:"",city:"",ielts:"",test:"",sch:"",sort:"deadline"};render()};

function list(){const R=$("#results");
 if(!ready){R.innerHTML='<p class="mut">Loading programs…</p>';return}
 if(!DB){R.innerHTML='<div class="card">Program data could not be loaded. Please try again later.</div>';$("#count").textContent="";return}
 const L=filtered();$("#count").textContent=`${L.length} matching program${L.length===1?"":"s"}`;
 R.innerHTML=L.length?L.slice(0,shown).map(r=>{const s=status(r);return `<article class="card"><div class="mut">${esc(v(r,"university"))}</div><h3 style="margin:4px 0 8px">${esc(v(r,"program"))}</h3>
<span class="tag">${esc(v(r,"field"))}</span><span class="tag">${esc(v(r,"level"))}</span><span class="tag">${esc(v(r,"language"))}</span><span class="tag ${stCls(s)}">${s}</span>

 $("#more").innerHTML=L.length>shown?'<button class="btn alt" id="lm">Load More</button>':"";$("#lm")&&($("#lm").onclick=()=>{shown+=12;list()})}

function pageProgram(id){if(!ready)return"<p>Loading…</p>";const r=ROWS.find(x=>pid(x)===id);if(!r)return'<div class="card"><b>Program not found.</b> <a href="#explore">Back to programs</a></div>';
 const s=status(r),lk=(u,t)=>dt&&u&&/^https?:/i.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:NA;
 const docs=String(r.docs||"").split(/[;,\n]/).map(x=>x.trim()).filter(Boolean);
 const sec=(t,rows)=>`<div class="card" style="margin-bottom:14px"><h3 style="margin-top:0">${t}</h3><dl>${rows.map(([a,b,raw])=>`<dt>${a}</dt><dd>${raw?b:esc(b)}</dd>`).join("")}</dl></div>`;
 return `<a href="#explore">← Back to programs</a><h1>${esc(v(r,"program"))}</h1><p><span class="tag ${stCls(s)}">${s}</span> <span class="mut">Last updated: ${fmt(r.updated)}</span></p>
${sec("University",[["Name",v(r,"university")],["City / region",v(r,"city")+" / "+v(r,"region")],["Website",lk(r.uni_website,"Official university website"),1]])}
${sec("Program",[["Degree level",v(r,"level")],["Field",v(r,"field")],["Language",v(r,"language")],["Duration",v(r,"duration")],["Tuition",v(r,"tuition")],["Scholarships",v(r,"scholarship")]])}
${sec("Admission requirements",[["Academic background",v(r,"academic_req")],["Minimum GPA",v(r,"gpa")],["English",v(r,"english_req")],["IELTS",v(r,"ielts")],["Entrance exam",v(r,"entrance_test")+(r.exams?" – "+r.exams:"")],["Additional",v(r,"extra_req")]])}
<div class="card" style="margin-bottom:14px"><h3 style="margin-top:0">Required documents</h3>${docs.length?"<ul>"+docs.map(d=>`<li>${esc(d)}</li>`).join("")+"</ul>":"<p class=mut>Not Available</p>"}</div>
${sec("Application timeline",[["Opens",fmt(r.open_date)],["Deadline",fmt(r.deadline)],["Round",v(r,"round")],["Intake",v(r,"intake")]])}
${sec("Official sources",[["Program page",lk(r.program_url,"Open"),1],["Application portal",lk(r.apply_url,"Open"),1],["Requirements",lk(r.req_url,"Open"),1],["Data source",lk(r.source_url,"Open"),1],["Last verified",fmt(r.verified)]])}
<p><a class="btn g" target="_blank" rel="noopener" href="${/^https?:/i.test(r.uni_website||"")?esc(r.uni_website):"#"}">Visit Official University Website</a></p>
<p class="note">Information on this page is provided for reference only and may be incomplete or outdated. Please verify all admission requirements and deadlines directly with the university before applying.</p>`}

function pageAbout(){return `<h1>About This Project</h1><div class="card" style="position:relative;overflow:hidden"><div class="orb" aria-hidden="true"></div><h2 style="margin-top:0;max-width:560px">Hi! I’m Just Another Student Planning to <em class="ac">Study in Italy.</em> 🇮🇹</h2>

function pageAdmin(){if(!isAdmin)return'<div class="card"><b>Admin area</b><p class="mut">Only the site owner can open this page.</p></div>';
 return `<h1>Admin</h1><div class="card"><h3 style="margin-top:0">Import Excel / CSV</h3><input type="file" id="file" accept=".xlsx,.xls,.csv"><label for="mode">Import mode</label><select id="mode"><option value="add">Add new programs only</option><option value="update">Update existing programs</option><option value="replace">Replace entire dataset</option></select><div id="prev" class="mut" style="margin-top:12px"></div></div>

<p class="note">Tip: give each row a unique <b>id</b> column. Columns are matched automatically by header name (e.g. “University”, “Program name”, “Deadline”). Dates should be YYYY-MM-DD.</p>`}
function mapRow(o){const n={};for(const h in o){const k=h.toLowerCase().replace(/[^a-z0-9]/g,"");const key=KEYS.find(x=>x.replace(/_/g,"")===k)||Object.keys(ALIAS).find(x=>ALIAS[x].includes(k));if(key){let val=o[h];if(val instanceof Date)val=val.toISOString().slice(0,10);n[key]=val}}
 if(!n.id&&n.university&&n.program)n.id=(n.university+"-"+n.program).toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,80);return n}
function bindAdmin(){if(!isAdmin)return;
 $("#file").onchange=async e=>{const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}).map(mapRow).filter(r=>r.id&&r.program);
  const seen=new Set(),dups=[];rows.forEach(r=>{if(seen.has(r.id))dups.push(r.id);seen.add(r.id)});
  const ex=new Set(ROWS.map(r=>r.id)),nw=rows.filter(r=>!ex.has(r.id)).length;pending=rows;
  $("#prev").innerHTML=`<b>${rows.length}</b> valid rows · ${nw} new · ${rows.length-nw} already exist${dups.length?` · <span style="color:#b33">duplicate IDs in file: ${esc(dups.slice(0,5).join(", "))}</span>`:""}<div class="pre"><table><tr>${["id","university","program","field","level","deadline"].map(k=>`<th>${k}</th>`).join("")}</tr>${rows.slice(0,5).map(r=>`<tr>${["id","university","program","field","level","deadline"].map(k=>`<td>${esc(r[k]||"")}</td>`).join("")}</tr>`).join("")}</table></div><p><button class="btn g" id="pub">Publish import</button></p>`;
  $("#pub").onclick=doImport};
 $("#exp").onclick=async()=>{const d=await claude.use("downloads");if(!d)return alert("Download is not available here.");const ws=XLSX.utils.json_to_sheet(ROWS),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Programs");try{await d.save({filename:"programs.xlsx",data:new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})])})}catch(e){}};
 $("#addone").onclick=()=>editForm({});
 document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editForm(ROWS.find(r=>r.id===b.dataset.e)));
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this program?"))await DB.collection("programs").doc(b.dataset.d).delete()})}
async function doImport(){const m=$("#mode").value,now=new Date().toISOString().slice(0,10),ex=new Set(ROWS.map(r=>r.id));
 if(m==="replace"&&!confirm("This deletes ALL existing programs first. Continue?"))return;
 $("#pub").disabled=true;$("#pub").textContent="Importing…";
 try{if(m==="replace")for(const r of ROWS)await DB.collection("programs").doc(r.id).delete();
 for(const r of pending){const id=String(r.id).replace(/\//g,"-");if(m==="add"&&ex.has(id))continue;if(m==="update"&&!ex.has(id))continue;
  const o={...r,id,updated:now};m==="update"?await DB.collection("programs").doc(id).update(o):await DB.collection("programs").doc(id).set(o)}
 pending=null;$("#prev").textContent="Import complete."}catch(e){$("#prev").textContent="Import failed: "+(e.message||e.code)}}
function editForm(r){$("#edit").innerHTML=`<div class="card" style="margin-top:14px"><h3 style="margin-top:0">${r.id?"Edit":"Add"} program</h3><div class="grid">${KEYS.map(k=>`<div><label>${k}</label><input data-k="${k}" value="${esc(r[k]||"")}" ${k==="id"&&r.id?"readonly":""}></div>`).join("")}</div><p><button class="btn g" id="save">Save</button></p></div>`;
 $("#save").onclick=async()=>{const o={};document.querySelectorAll("[data-k]").forEach(i=>o[i.dataset.k]=i.value);if(!o.id||!o.program)return alert("ID and program name are required.");o.id=o.id.replace(/\//g,"-");o.updated=new Date().toISOString().slice(0,10);try{await DB.collection("programs").doc(o.id).set(o);$("#edit").innerHTML=""}catch(e){alert("Save failed: "+(e.message||e.code))}}}
render();initDb();
</script></body></html>
